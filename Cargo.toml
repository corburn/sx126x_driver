[package]
name = "sx126x"
version = "0.1.0"
edition = "2021"
authors = ["Semtech Corporation", "Rust Migration Contributors"]
license = "BSD-3-Clause-Clear"
description = "Rust driver for Semtech SX126x LoRa transceivers"
repository = "https://github.com/corburn/sx126x_driver"
keywords = ["lora", "sx126x", "embedded", "radio", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
embedded-hal = "1.0"

[features]
default = []
bpsk = []
lr-fhss = []

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimization with single codegen unit
